name: Auditoría de regresión Convivencia Escolar
on:
  pull_request:
    branches: [convivencia-escolar]
    paths:
      - 'convivencia-api/**'
      - 'convivencia-escolar/**'
      - '.github/workflows/convivencia-regresion.yml'
  push:
    branches: [convivencia-escolar]
    paths:
      - 'convivencia-api/**'
      - 'convivencia-escolar/**'
      - '.github/workflows/convivencia-regresion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias de pruebas locales
        working-directory: convivencia-api
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Comprobar sintaxis de API e instrumentos
        run: |
          node --check convivencia-api/server.js
          node --check convivencia-api/pilot-selftest.js
          for file in convivencia-api/*.js convivencia-escolar/js/*.js; do
            node --check "$file"
          done
      - name: Pruebas automatizadas con bases ficticias y proveedores simulados
        working-directory: convivencia-api
        run: npm test
