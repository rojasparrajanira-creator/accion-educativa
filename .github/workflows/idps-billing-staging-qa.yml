name: IDPS billing staging isolated QA
on:
  push:
    branches:
      - test/idps-suscripciones-staging-20261016
    paths:
      - 'idps-system/subscription-staging.js'
      - 'idps-system/test-subscription-staging.js'
      - 'idps-system/subscription-billing.js'
      - 'idps-system/monthly-payment.js'
      - '.github/workflows/idps-billing-staging-qa.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax verification
        run: |
          node --check idps-system/subscription-staging.js
          node --check idps-system/subscription-billing.js
      - name: Install dependencies
        working-directory: idps-system
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Security checks for staging
        working-directory: idps-system
        run: node --test test-subscription-staging.js
      - name: Billing lifecycle mock checks
        working-directory: idps-system
        run: npm run qa:monthly-payment
      - name: Check isolated Render staging is payment-disabled and locked
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 65 https://idps-suscripciones-pruebas.onrender.com/health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] is True; assert d["environment"]=="staging"; assert d["paymentsEnabled"] is False; assert d["productionTokensBlocked"] is True; assert d["databaseConfigured"] is False'
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 40 https://idps-suscripciones-pruebas.onrender.com/pago-mensual)
          test "$code" = "401"
