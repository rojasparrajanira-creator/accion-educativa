name: IDPS superadmin recovery QA
on:
  push:
    branches:
      - feature/idps-superadmin-recovery-20261016
    paths:
      - 'idps-system/superadmin-recovery.js'
      - 'idps-system/test-superadmin-recovery.js'
      - 'idps-system/server.js'
      - '.github/workflows/idps-superadmin-recovery-qa.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check recovery and IDPS server
        run: |
          node --check idps-system/server.js
          node --check idps-system/superadmin-recovery.js
      - name: Install dependencies
        working-directory: idps-system
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Recovery security test suite
        working-directory: idps-system
        run: node --test test-superadmin-recovery.js
