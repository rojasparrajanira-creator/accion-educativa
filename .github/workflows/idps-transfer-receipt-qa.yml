name: IDPS transfer receipts review QA
on:
  push:
    branches:
      - feature/idps-comprobantes-transferencias-20261017
    paths:
      - 'idps-system/server.js'
      - 'idps-system/request-payment.js'
      - 'idps-system/request-payment-admin.js'
      - 'idps-system/test-request-payment.js'
      - '.github/workflows/idps-transfer-receipt-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate server and payment modules
        run: |
          node --check idps-system/server.js
          node --check idps-system/request-payment.js
          node --check idps-system/request-payment-admin.js
      - name: Verify receipt types, payment info and escaping
        working-directory: idps-system
        run: node --test test-request-payment.js
