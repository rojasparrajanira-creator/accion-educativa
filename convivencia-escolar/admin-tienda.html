<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administrar Tienda · Material Educativo Chile</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f8fb;color:#26313d}header{background:#fff;border-bottom:1px solid #e5e9ef;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e4e9ef;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px #2030400a}h1,h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}input,textarea,select{width:100%;padding:11px 12px;border:1px solid #cfd7e1;border-radius:10px;font:inherit}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;background:#173e35;color:#fff}.secondary{background:#eef2f5;color:#26313d}.product{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid #edf0f3}.product img{width:90px;height:70px;object-fit:cover;border-radius:10px;background:#eef2f5}.muted{color:#73808d;font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef7f3;color:#173e35;font-size:12px;font-weight:800}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.product{grid-template-columns:70px 1fr}.product>button{grid-column:1/-1}.product img{width:70px;height:60px}}</style></head>
<body><header><strong>Material Educativo Chile · Tienda</strong><button class="secondary" onclick="location.href='admin-plataforma.html'">Volver</button></header>
<main><section class="card"><h1>Administrar productos</h1><p class="muted">Tú eliges qué materiales publicar. El enlace de Drive se guarda para la entrega posterior al pago y no aparece en el catálogo público.</p>
<form id="form"><input type="hidden" id="id"><div class="grid">
<div><label>Nombre del material *</label><input id="title" required></div>
<div><label>Destinatarios / niveles</label><input id="audience" placeholder="Ej.: 7°–8° básico"></div>
<div class="full"><label>Objetivo del taller/material *</label><textarea id="objective" required></textarea></div>
<div class="full"><label>Descripción / detalle *</label><textarea id="description" required></textarea></div>
<div class="full"><label>Materiales incluidos *</label><textarea id="included" placeholder="PPT, cuadernillo, infografías..." required></textarea></div>
<div><label>Fotografía (URL HTTPS)</label><input id="image" type="url" placeholder="https://..."></div>
<div><label>Enlace privado de entrega Drive *</label><input id="drive" type="url" placeholder="https://drive.google.com/..." required></div>
<div><label>Precio CLP *</label><input id="price" type="number" min="0" step="1" required></div>
<div><label>Precio normal (opcional, para mostrar oferta)</label><input id="compare" type="number" min="0" step="1"></div>
<div><label>Estado</label><select id="status"><option value="draft">Borrador</option><option value="published">Publicado</option><option value="archived">Archivado</option></select></div>
</div><div class="actions"><button type="submit">Guardar producto</button><button type="button" class="secondary" onclick="clearForm()">Nuevo / limpiar</button></div><p id="msg" class="muted"></p></form></section>
<section class="card"><h2>Productos cargados</h2><div id="products" class="muted">Cargando…</div></section></main>
<script>
const API='https://convivencia-escolar-api.onrender.com';let rows=[];
const $=id=>document.getElementById(id);
async function api(path,opt={}){const r=await fetch(API+path,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error');return d}
function money(v){return new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(v||0))}
function clearForm(){['id','title','audience','objective','description','included','image','drive','price','compare'].forEach(x=>$(x).value='');$('status').value='draft';$('msg').textContent=''}
function edit(id){const p=rows.find(x=>Number(x.id)===Number(id));if(!p)return; $('id').value=p.id;$('title').value=p.title||'';$('audience').value=p.audience||'';$('objective').value=p.objective||'';$('description').value=p.description||'';$('included').value=p.included_materials||'';$('image').value=p.image_url||'';$('drive').value=p.drive_delivery_url||'';$('price').value=p.price_clp??'';$('compare').value=p.compare_at_price_clp??'';$('status').value=p.status||'draft';scrollTo({top:0,behavior:'smooth'})}
async function load(){try{const d=await api('/api/store/admin/products');rows=d.products||[];$('products').innerHTML=rows.length?rows.map(p=>`<div class="product"><img src="${p.image_url||''}" alt=""><div><strong>${p.title}</strong><div class="muted">${money(p.price_clp)} · <span class="badge">${p.status}</span></div></div><button onclick="edit(${p.id})">Editar</button></div>`).join(''):'Aún no has cargado productos.'}catch(e){if(e.message==='authentication_required'||e.message==='role_forbidden')location.replace('ingreso.html');else $('products').textContent='No fue posible cargar: '+e.message}}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('msg').textContent='Guardando…';const id=$('id').value;const body={title:$('title').value,audience:$('audience').value,objective:$('objective').value,description:$('description').value,included_materials:$('included').value,image_url:$('image').value,drive_delivery_url:$('drive').value,price_clp:Number($('price').value),compare_at_price_clp:$('compare').value?Number($('compare').value):null,status:$('status').value};try{await api('/api/store/admin/products'+(id?'/'+id:''),{method:'POST',body:JSON.stringify(body)});$('msg').textContent='Producto guardado correctamente.';clearForm();await load()}catch(err){$('msg').textContent='No se pudo guardar: '+err.message}});
load();
</script></body></html>
