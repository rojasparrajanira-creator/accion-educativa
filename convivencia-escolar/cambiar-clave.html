<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cambiar clave · Convivencia Escolar</title>
<style>
:root{--green:#173E35;--green2:#2F8067;--line:#DCE6E0;--muted:#718078;--navy:#0F2D52}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef7f3;display:grid;place-items:center;padding:24px;color:#20352F}
.card{width:min(500px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 20px 55px rgba(23,62,53,.13)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand img{width:62px;height:62px;object-fit:contain}.brand b{color:var(--navy)}.brand span{display:block;color:var(--muted);font-size:11px}
h1{color:var(--green);margin:7px 0;font-size:27px}.sub{color:var(--muted);font-size:13px;line-height:1.55}.field{margin:13px 0}.field label{display:block;font-size:11px;font-weight:800;color:#567064;margin-bottom:6px}.field input{width:100%;border:1px solid #D7E3DC;border-radius:12px;padding:12px;font:inherit}
button{width:100%;border:0;border-radius:12px;background:var(--green);color:#fff;padding:13px;font:inherit;font-weight:850;cursor:pointer}.status{min-height:20px;font-size:12px;color:#9a3b32}.rule{font-size:11px;color:var(--muted);background:#f5faf7;border-radius:12px;padding:11px}
</style>
<script src="js/auth-professional.js"></script><script>MECAuth.guard({allowAnyRole:true,bindEstablishment:false});</script>
</head>
<body><main class="card">
<div class="brand"><img src="assets/logo.jpeg" alt="Material Educativo Chile"><div><b>Convivencia Escolar</b><span data-establishment-name>Establecimiento</span></div></div>
<small style="color:#2F8067;font-weight:850">SEGURIDAD DE LA CUENTA</small>
<h1>Cambiar mi clave</h1>
<p class="sub">Por seguridad, las cuentas nuevas deben reemplazar su clave temporal antes de acceder a la plataforma.</p>
<form id="form">
  <div class="field"><label>Clave actual</label><input id="current" type="password" autocomplete="current-password" required></div>
  <div class="field"><label>Nueva clave</label><input id="next" type="password" autocomplete="new-password" required minlength="10"></div>
  <div class="field"><label>Repetir nueva clave</label><input id="repeat" type="password" autocomplete="new-password" required minlength="10"></div>
  <p class="rule">Usa al menos 10 caracteres e incluye letras y números. No reutilices la clave temporal.</p>
  <button id="save" type="submit">Guardar nueva clave</button>
  <p class="status" id="status" role="alert" aria-live="polite"></p>
</form>
</main>
<script>
const form=document.getElementById('form'),status=document.getElementById('status'),save=document.getElementById('save');
function safeNext(){const q=new URLSearchParams(location.search),next=q.get('next');return next&&/^[a-z0-9._-]+\.html(?:\?.*)?$/i.test(next)?next:null}
form.addEventListener('submit',async e=>{
 e.preventDefault();
 const current=document.getElementById('current').value,next=document.getElementById('next').value,repeat=document.getElementById('repeat').value;
 if(next!==repeat){status.textContent='Las nuevas claves no coinciden.';return}
 if(next===current){status.textContent='La nueva clave debe ser distinta de la clave temporal o actual.';return}
 if(next.length<10||!/[A-Za-zÁÉÍÓÚÑáéíóúñ]/.test(next)||!/[0-9]/.test(next)){status.textContent='La nueva clave debe tener al menos 10 caracteres, letras y números.';return}
 save.disabled=true;status.textContent='Guardando nueva clave…';
 try{
   const r=await fetch(MECAuth.API+'/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:current,new_password:next})});
   const d=await r.json();
   if(!r.ok||!d.ok)throw new Error(d.error||'change_failed');
   status.style.color='#176B5B';status.textContent='Clave actualizada correctamente.';
   const user=await MECAuth.me(),role=MECAuth.roleOf(user);
   const next=safeNext();
   location.href=role==='platform_admin'?(next||'admin-plataforma.html'):['coordinador_convivencia','dupla_psicosocial'].includes(role)?'inicio.html?establishment_id='+encodeURIComponent(user.establishment_id):'notificaciones.html?establishment_id='+encodeURIComponent(user.establishment_id);
 }catch(err){
   status.style.color='#9a3b32';
   status.textContent=err.message==='invalid_current_password'?'La clave actual no es correcta.':'No fue posible cambiar la clave.';
   save.disabled=false;
 }
});
</script></body></html>
