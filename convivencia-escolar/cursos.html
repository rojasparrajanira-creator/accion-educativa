<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cursos</title><style>body{font-family:Arial;margin:0;background:#eef9f5;color:#29443d}main{max-width:1000px;margin:32px auto;padding:20px}.card{background:white;border:1px solid #d8ebe4;border-radius:20px;padding:26px}h1{color:#176b5b}</style></head><body><main><section class="card"><small>CONVIVENCIA EDUCATIVA</small><h1>Cursos</h1><p>Administración de cursos del establecimiento.</p><div id="cursos" style="margin-top:20px"></div><script>
const API='https://convivencia-escolar-api.onrender.com';
fetch(API+'/api/courses').then(r=>r.json()).then(d=>{if(d.ok)document.getElementById('cursos').innerHTML=d.courses.length?d.courses.map(c=>'<div class="card" style="margin-top:12px"><b>'+c.name+'</b><p>Año '+c.school_year+' · '+c.establishment+'</p></div>').join(''):'<p>Aún no hay cursos cargados.</p>'}).catch(()=>document.getElementById('cursos').innerHTML='<p>No fue posible cargar los cursos.</p>');
</script></section></main></body></html>
