<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulario I-II medio</title><style>body{font-family:Arial,sans-serif;background:#eef9f5;color:#243f37;margin:0}.w{max-width:780px;margin:40px auto;padding:20px}.c{background:#fff;border:1px solid #d7ebe4;border-radius:20px;padding:28px}h1{color:#176B5B}.o{display:block;padding:13px;margin:9px 0;border:1px solid #cfe2dc;border-radius:12px}.b{margin-top:18px;background:#2F9B83;color:#fff;border:0;border-radius:11px;padding:12px 18px;font-weight:bold}</style></head><body><main class="w"><section class="c"><small>CONVIVENCIA EDUCATIVA</small><h1>I°–II° medio</h1><p>Selecciona la alternativa que mejor represente tu experiencia.</p><label class="o"><input type="radio" name="r"> Nunca</label><label class="o"><input type="radio" name="r"> Casi nunca</label><label class="o"><input type="radio" name="r"> A veces</label><label class="o"><input type="radio" name="r"> Casi siempre</label><label class="o"><input type="radio" name="r"> Siempre</label><button class="b" type="button">Continuar</button></section></main><script src="js/encuesta-api.js"></script><section id="pilot-save" style="max-width:760px;margin:20px auto;padding:18px;background:#fff;border:1px solid #dff3ec;border-radius:16px"><h3>Prueba técnica de guardado</h3><p>Selecciona una respuesta para comprobar el circuito de esta aplicación.</p><label style="display:block;margin:8px 0"><input type="radio" name="pilotValue" value="1"> Nunca</label><label style="display:block;margin:8px 0"><input type="radio" name="pilotValue" value="2"> Casi nunca</label><label style="display:block;margin:8px 0"><input type="radio" name="pilotValue" value="3"> A veces</label><label style="display:block;margin:8px 0"><input type="radio" name="pilotValue" value="4"> Casi siempre</label><label style="display:block;margin:8px 0"><input type="radio" name="pilotValue" value="5"> Siempre</label><button type="button" id="pilotSubmit" style="margin-top:12px;padding:11px 16px;border:0;border-radius:10px;background:#176B5B;color:white;font-weight:700">Guardar y finalizar prueba</button><p id="pilotMsg"></p></section><script>document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('pilotSubmit');if(!b)return;b.onclick=async()=>{const q=document.querySelector('input[name="pilotValue"]:checked'),m=document.getElementById('pilotMsg');if(!q){m.textContent='Selecciona una respuesta.';return}m.textContent='Guardando…';try{await MECSurvey.savePilot('1-2-medio',q.value)}catch(e){m.textContent='No fue posible guardar esta respuesta.'}}})</script></body></html>
