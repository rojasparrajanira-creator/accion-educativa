<!doctype html><html lang="es"><head><meta charset="utf-8"><title>III-IV medio</title></head><body><main><h1>III°–IV° medio</h1><p>Aplicación de Convivencia Educativa.</p><a href="encuesta-completada.html">Continuar</a></main><script src="js/encuesta-api.js"></script><section id="pilot-save" style="max-width:760px;margin:20px auto;padding:18px;background:#fff;border:1px solid #dff3ec;border-radius:16px"><h3>Prueba técnica de guardado</h3><p>Selecciona una respuesta para comprobar el circuito de esta aplicación.</p><label style="display:block;margin:8px 0"><input type="radio" name="pilotValue" value="1"> Nunca</label><label style="display:block;margin:8px 0"><input type="radio" name="pilotValue" value="2"> Casi nunca</label><label style="display:block;margin:8px 0"><input type="radio" name="pilotValue" value="3"> A veces</label><label style="display:block;margin:8px 0"><input type="radio" name="pilotValue" value="4"> Casi siempre</label><label style="display:block;margin:8px 0"><input type="radio" name="pilotValue" value="5"> Siempre</label><button type="button" id="pilotSubmit" style="margin-top:12px;padding:11px 16px;border:0;border-radius:10px;background:#176B5B;color:white;font-weight:700">Guardar y finalizar prueba</button><p id="pilotMsg"></p></section><script>document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('pilotSubmit');if(!b)return;b.onclick=async()=>{const q=document.querySelector('input[name="pilotValue"]:checked'),m=document.getElementById('pilotMsg');if(!q){m.textContent='Selecciona una respuesta.';return}m.textContent='Guardando…';try{await MECSurvey.savePilot('3-4-medio',q.value)}catch(e){m.textContent='No fue posible guardar esta respuesta.'}}})</script></body></html>
