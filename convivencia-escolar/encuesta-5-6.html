<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aplicación 5°–6° básico</title><style>body{font-family:Arial,sans-serif;background:#eef9f5;color:#234;margin:0}.wrap{max-width:780px;margin:40px auto;padding:20px}.card{background:white;padding:28px;border-radius:20px;border:1px solid #d7ebe4}h1{color:#176B5B}.opt{padding:14px;border:1px solid #cfe2dc;border-radius:12px;margin:9px 0;cursor:pointer}.opt.on{background:#dff3ec;border-color:#2F9B83}.btn{margin-top:18px;padding:12px 18px;border:0;border-radius:11px;background:#2F9B83;color:white;font-weight:bold}</style></head><body><main class="wrap"><section class="card"><small>CONVIVENCIA EDUCATIVA · 5°–6° BÁSICO</small><h1>Aplicación del instrumento</h1><p>Selecciona la alternativa que mejor represente tu experiencia.</p><div class="opt" onclick="pick(this)">Nunca</div><div class="opt" onclick="pick(this)">Casi nunca</div><div class="opt" onclick="pick(this)">A veces</div><div class="opt" onclick="pick(this)">Casi siempre</div><div class="opt" onclick="pick(this)">Siempre</div><button class="btn">Continuar</button></section></main><script>function pick(e){document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));e.classList.add('on')}</script><script src="js/encuesta-api.js"></script></body></html>
