<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aplicación 5°–6° básico</title><style>body{font-family:Arial,sans-serif;background:#eef9f5;color:#234;margin:0}.wrap{max-width:780px;margin:40px auto;padding:20px}.card{background:white;padding:28px;border-radius:20px;border:1px solid #d7ebe4}h1{color:#176B5B}.opt{padding:14px;border:1px solid #cfe2dc;border-radius:12px;margin:9px 0;cursor:pointer}.opt.on{background:#dff3ec;border-color:#2F9B83}.btn{margin-top:18px;padding:12px 18px;border:0;border-radius:11px;background:#2F9B83;color:white;font-weight:bold}</style></head><body><main class="wrap"><section class="card"><small>CONVIVENCIA EDUCATIVA · 5°–6° BÁSICO</small><h1>Aplicación del instrumento</h1><p>Selecciona la alternativa que mejor represente tu experiencia.</p><div class="opt" onclick="pick(this)">Nunca</div><div class="opt" onclick="pick(this)">Casi nunca</div><div class="opt" onclick="pick(this)">A veces</div><div class="opt" onclick="pick(this)">Casi siempre</div><div class="opt" onclick="pick(this)">Siempre</div><button class="btn">Continuar</button></section></main><script>function pick(e){document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));e.classList.add('on')}</script><script src="js/encuesta-api.js"></script><section id="pilot-save" style="max-width:760px;margin:20px auto;padding:18px;background:#fff;border:1px solid #dff3ec;border-radius:16px"><h3>Prueba técnica de guardado</h3><p>Selecciona una respuesta para comprobar el circuito de esta aplicación.</p><label style="display:block;margin:8px 0"><input type="radio" name="pilotValue" value="1"> Nunca</label><label style="display:block;margin:8px 0"><input type="radio" name="pilotValue" value="2"> Casi nunca</label><label style="display:block;margin:8px 0"><input type="radio" name="pilotValue" value="3"> A veces</label><label style="display:block;margin:8px 0"><input type="radio" name="pilotValue" value="4"> Casi siempre</label><label style="display:block;margin:8px 0"><input type="radio" name="pilotValue" value="5"> Siempre</label><button type="button" id="pilotSubmit" style="margin-top:12px;padding:11px 16px;border:0;border-radius:10px;background:#176B5B;color:white;font-weight:700">Guardar y finalizar prueba</button><p id="pilotMsg"></p></section><script>document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('pilotSubmit');if(!b)return;b.onclick=async()=>{const q=document.querySelector('input[name="pilotValue"]:checked'),m=document.getElementById('pilotMsg');if(!q){m.textContent='Selecciona una respuesta.';return}m.textContent='Guardando…';try{await MECSurvey.savePilot('5-6',q.value)}catch(e){m.textContent='No fue posible guardar esta respuesta.'}}})</script></body></html>
