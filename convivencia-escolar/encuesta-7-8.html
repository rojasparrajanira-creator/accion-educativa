<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encuesta 7°–8°</title><style>body{font-family:Inter,Arial;background:#eef9f5;color:#29443d;margin:0}main{max-width:760px;margin:30px auto;padding:22px}.card{background:#fff;border:1px solid #d8ebe4;border-radius:20px;padding:24px;margin:14px 0}h1{color:#176b5b}.q{margin:22px 0}.opts{display:flex;flex-wrap:wrap;gap:10px}.opts label{border:1px solid #cfe5dd;border-radius:12px;padding:10px;background:#f7fcfa}button{background:#176b5b;color:white;border:0;border-radius:12px;padding:13px 20px;font-weight:700}</style></head><body><main><h1>Convivencia Educativa</h1><p>7° y 8° básico · Piloto M1</p><form id="survey" class="card"><div class="q"><b>1. Me siento seguro/a en mi establecimiento.</b><div class="opts" data-code="D01_01"></div></div><div class="q"><b>2. En mi curso nos tratamos con respeto.</b><div class="opts" data-code="D02_01"></div></div><div class="q"><b>3. Siento que pertenezco a mi comunidad educativa.</b><div class="opts" data-code="D08_01"></div></div><div class="q"><b>4. Sé a qué adulto acudir si necesito ayuda.</b><div class="opts" data-code="D13_01"></div></div><button>Finalizar y guardar</button><p id="msg"></p></form></main><script>
const API='https://convivencia-escolar-api.onrender.com', labels=['Nunca','Casi nunca','A veces','Casi siempre','Siempre'];document.querySelectorAll('.opts').forEach(x=>labels.forEach((l,i)=>x.insertAdjacentHTML('beforeend','<label><input required type="radio" name="'+x.dataset.code+'" value="'+(i+1)+'"> '+l+'</label>')));
document.getElementById('survey').onsubmit=async e=>{e.preventDefault();const id=new URLSearchParams(location.search).get('application_id');if(!id){msg.textContent='Falta el código de aplicación.';return}const responses=[...document.querySelectorAll('.opts')].map(x=>({item_code:x.dataset.code,value:Number(document.querySelector('input[name="'+x.dataset.code+'"]:checked').value)}));try{const r=await fetch(API+'/api/applications/'+id+'/responses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({responses})});const d=await r.json();if(d.ok)location.href='encuesta-completada.html?application_id='+id;else msg.textContent='No fue posible guardar.'}catch(err){msg.textContent='Error de conexión.'}};
</script></body></html>
