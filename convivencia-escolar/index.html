<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convivencia Escolar · Material Educativo Chile</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef7f3;color:#173E35}
main{text-align:center;padding:28px}.mark{width:70px;height:70px;margin:0 auto 16px;border-radius:22px;background:#173E35;color:#fff;display:grid;place-items:center;font-weight:900;font-size:23px}p{color:#718078}
</style>
</head>
<body>
<main><div class="mark">CE</div><strong>Convivencia Escolar</strong><p>Validando acceso seguro…</p></main>
<script>
const API='https://convivencia-escolar-api.onrender.com';
(async()=>{
 try{
  const r=await fetch(API+'/api/auth/me',{credentials:'include'}),d=await r.json();
  if(r.ok&&d.ok&&d.user){location.replace('inicio.html?establishment_id='+encodeURIComponent(d.user.establishment_id));return}
 }catch(e){}
 location.replace('ingreso.html');
})();
</script>
</body>
</html>
