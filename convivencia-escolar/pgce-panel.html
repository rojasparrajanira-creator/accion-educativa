<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel PGCE</title><style>
body{margin:0;font-family:Inter,Arial,sans-serif;background:#eef9f5;color:#24443c}main{max-width:1150px;margin:auto;padding:28px}h1,h2{color:#176b5b}.box,.card,.metric{background:white;border:1px solid #d5eae3;border-radius:18px;padding:18px}.metrics,.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(auto-fit,minmax(145px,1fr));margin:16px 0}.grid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.metric strong{display:block;font-size:1.65rem;color:#176b5b}.tag{display:inline-block;background:#dff3ec;border-radius:999px;padding:5px 9px;font-weight:800}.small{font-size:.88rem;color:#5d746e}.alert{border-color:#ead7b1;background:#fffaf0}.btn{display:inline-block;border:0;border-radius:11px;padding:10px 13px;background:#176b5b;color:white;font-weight:800;text-decoration:none;cursor:pointer}input{padding:10px;border:1px solid #bfd9d1;border-radius:10px}</style><script src="js/auth-professional.js"></script><script>MECAuth.guard();</script></head><body><main>
<h1>Panel institucional PGCE</h1><section class="box"><strong id="school">Gestión de Convivencia Escolar</strong><p class="small">Vista consolidada de prioridades, intervenciones, avance y seguimiento M1–M2–M3.</p><input id="eid" inputmode="numeric" placeholder="ID establecimiento"> <button id="load" class="btn">Cargar panel</button> <a id="follow" class="btn" href="pgce-seguimiento.html">Seguimiento</a></section>
<p id="msg" class="small"></p><section id="metrics" class="metrics"></section><h2>Intervenciones</h2><section id="cards" class="grid"></section>
<script>
const API='https://convivencia-escolar-api.onrender.com';const q=new URLSearchParams(location.search);eid.value=q.get('establishment_id')||'';
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function show(){const id=eid.value.trim();if(!id){msg.textContent='Ingrese o seleccione un establecimiento.';return}follow.href='pgce-seguimiento.html?establishment_id='+encodeURIComponent(id);msg.textContent='Cargando…';try{const r=await fetch(API+'/api/pgce/dashboard?establishment_id='+encodeURIComponent(id));const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'dashboard_error');school.textContent=d.establishment.name+(d.establishment.rbd?' · RBD '+d.establishment.rbd:'');const s=d.summary;const m=[['Intervenciones',s.total],['En ejecución',s.by_status.in_progress||0],['Completadas',s.by_status.completed||0],['Sin seguimiento',s.without_updates],['Plazo vencido',s.overdue]];metrics.innerHTML=m.map(x=>'<div class="metric"><strong>'+safe(x[1])+'</strong>'+safe(x[0])+'</div>').join('');cards.innerHTML=d.interventions.length?d.interventions.map(x=>{const late=new Date(x.end_date)<new Date()&&!['completed','suspended'].includes(x.status);return '<article class="card '+(late?'alert':'')+'"><span class="tag">'+safe(x.dimension_code)+'</span><h3>'+safe(x.indicator)+'</h3><p>'+safe(x.target)+'</p><p class="small">Responsable: '+safe(x.responsible)+'<br>Estado: '+safe(x.status)+' · Última medición: '+safe(x.last_measurement||'Sin seguimiento')+' · Avance: '+safe(x.last_progress??'—')+'%<br>Registros de seguimiento: '+safe(x.updates_count)+(late?'<br><strong>Requiere revisión de plazo.</strong>':'')+'</p></article>'}).join(''):'<div class="card">Aún no hay intervenciones PGCE registradas.</div>';msg.textContent='Panel actualizado.';history.replaceState(null,'','?establishment_id='+encodeURIComponent(id))}catch(e){msg.textContent='No fue posible cargar el panel: '+e.message}}
load.addEventListener('click',show);if(eid.value)show();
</script></main></body></html>
