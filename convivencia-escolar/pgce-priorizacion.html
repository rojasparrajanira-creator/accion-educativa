<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Priorización PGCE · MEC Convivencia</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#eef9f5;color:#25443c}main{max-width:1100px;margin:auto;padding:28px}h1{color:#176b5b}.note,.card{background:#fff;border:1px solid #d5eae3;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.dim{background:#fff;border:1px solid #d5eae3;border-radius:18px;padding:18px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#dff3ec;font-weight:800}.actions{font-size:.92rem;color:#527069}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#176b5b;color:#fff}.secondary{background:#e8f4fb;color:#0f2d52}.danger{background:#f3eeee;color:#713b3b}.panel{display:none}.panel.open{display:block}label{display:block;font-weight:700;margin-top:12px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bfd9d1;border-radius:10px;margin-top:5px}.why{padding-left:18px}.small{font-size:.88rem;color:#58736c}</style><script src="js/auth-professional.js"></script><script>MECAuth.guard();</script></head><body><main><h1>Priorización y Plan de Intervención PGCE</h1><div class="note"><strong>Revisión profesional obligatoria.</strong> Las prioridades son apoyos para la toma de decisiones. No constituyen diagnóstico clínico, sanción ni activación automática de protocolos.</div><div id="summary" class="card">Cargando resultados…</div><div id="dimensions" class="grid"></div><section id="editor" class="card panel"><h2 id="edTitle"></h2><div id="edWhy"></div><p id="edActions" class="actions"></p><label>Decisión profesional<select id="decision"><option value="">Seleccionar…</option><option value="aprobar">Aprobar propuesta</option><option value="ajustar">Ajustar propuesta</option><option value="descartar">Descartar</option></select></label><label>Responsable<input id="responsible"></label><label>Fecha inicio<input id="start" type="date"></label><label>Fecha término<input id="end" type="date"></label><label>Indicador<select id="indicator"></select></label><label>Meta<textarea id="target" rows="2"></textarea></label><label>Evidencia / medio de verificación<select id="evidence"></select></label><p><button id="save" class="btn primary">Guardar decisión profesional</button> <button id="cancel" class="btn secondary">Cerrar</button></p><div id="status" class="small"></div></section></main><script src="js/pgce-mapa.js"></script><script src="js/pgce-priorizacion.js"></script><script>
const qs=new URLSearchParams(location.search),API='https://convivencia-escolar-api.onrender.com';let current=null,currentEstablishmentId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){const id=qs.get('application_id');if(!id){summary.textContent='Falta application_id. Abra esta pantalla desde los resultados de una aplicación.';return}try{const r=await fetch(API+'/api/applications/'+encodeURIComponent(id)+'/results'),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'results_error');currentEstablishmentId=d.application&&d.application.establishment_id?d.application.establishment_id:null;summary.innerHTML='<strong>'+esc(d.application.student)+'</strong> · '+esc(d.application.course)+' · '+esc(d.application.measurement)+' · '+esc(d.application.survey_level)+'<br><span class="small">Se muestran D01–D16 para revisión profesional. Las experiencias adversas permanecen separadas.</span>';const entries=Object.entries(d.dimension_summary||{});const prior=entries.map(([dimension,x])=>MECPGCE_PRIORITY.classify({dimension,current:Number(x.average),critical:false,persistence:false,convergence:0}));dimensions.innerHTML=prior.map(p=>{const m=MECPGCE_MAP.dimensions[p.dimension];return '<article class="dim"><span class="badge">Por revisar</span><h3>'+esc(p.dimension)+' · '+esc(m.name)+'</h3><p class="small">Promedio dimensional descriptivo: '+esc(((d.dimension_summary||{})[p.dimension]||{}).average)+'</p><p>Objetivos PGCE: '+esc(m.pgce.join(', '))+'</p><button class="btn secondary" onclick="openEd(\''+p.dimension+'\')">Revisar propuesta</button></article>'}).join('');}catch(e){summary.textContent='No fue posible cargar los resultados: '+e.message}}
function openEd(code){const m=MECPGCE_MAP.dimensions[code];current=MECPGCE_PRIORITY.buildProposal({dimension:code,priority:'low',label:'Revisión profesional',reasons:['La dimensión fue seleccionada para revisión profesional.']});edTitle.textContent=code+' · '+m.name;edWhy.innerHTML='<strong>Fundamento</strong><ul class="why">'+current.reasons.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';edActions.textContent='Acciones PGCE relacionadas: '+m.actions.join(', ');indicator.innerHTML='<option value="">Seleccionar…</option>'+m.indicators.map(x=>'<option>'+esc(x)+'</option>').join('');evidence.innerHTML='<option value="">Seleccionar…</option>'+m.evidence.map(x=>'<option>'+esc(x)+'</option>').join('');editor.classList.add('open');editor.scrollIntoView({behavior:'smooth'})}
cancel.onclick=()=>editor.classList.remove('open');save.onclick=()=>{try{current={...current,decision:decision.value,responsible:responsible.value,start_date:start.value,end_date:end.value,indicator_selected:indicator.value,target:target.value,evidence_selected:evidence.value?[evidence.value]:[]};const out=MECPGCE_PRIORITY.validateDecision(current);const payload={source_application_id:Number(qs.get('application_id')),dimension_code:out.dimension,priority:out.priority,professional_decision:out.decision,responsible:out.responsible,start_date:out.start_date,end_date:out.end_date,indicator:out.indicator_selected,target:out.target,evidence:out.evidence_selected,rationale:out.reasons,pgce_objectives:out.objectives,pgce_action_ids:out.action_ids};if(out.decision==='descartar'){localStorage.setItem('mec_pgce_discard_'+qs.get('application_id')+'_'+out.dimension,JSON.stringify(out));status.textContent='Propuesta descartada por decisión profesional. No se creó una intervención.';return}status.textContent='Guardando intervención…';fetch(API+'/api/pgce/interventions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(async r=>{const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'save_failed');status.innerHTML='Intervención PGCE guardada en la base institucional. ID '+esc(d.intervention.id)+'.'+(currentEstablishmentId?' <a href="pgce-panel.html?establishment_id='+encodeURIComponent(currentEstablishmentId)+'">Abrir panel institucional PGCE</a>':'');save.disabled=true}).catch(e=>{status.textContent='No fue posible guardar en servidor: '+e.message})}catch(e){status.textContent='Falta completar: '+e.message}};load();
</script></body></html>
