<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguimiento PGCE · MEC</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#eef9f5;color:#24443c}main{max-width:1100px;margin:auto;padding:28px}h1{color:#176b5b}.bar,.card{background:#fff;border:1px solid #d5eae3;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.tag{display:inline-block;background:#dff3ec;padding:6px 10px;border-radius:999px;font-weight:800}.btn{border:0;border-radius:11px;padding:10px 13px;background:#176b5b;color:#fff;font-weight:800;cursor:pointer}input,select,textarea{width:100%;box-sizing:border-box;padding:9px;margin-top:5px;border:1px solid #bfd9d1;border-radius:9px}label{display:block;font-weight:700;margin-top:10px}.panel{display:none}.panel.open{display:block}.small{font-size:.88rem;color:#5c746e}</style></head><body><main><h1>Seguimiento de Intervenciones PGCE</h1><div class="bar">Seguimiento institucional M1–M2–M3. Cada actualización conserva la trazabilidad de la intervención, su avance, evidencia y ajustes.</div><label>Establecimiento ID<input id="eid" inputmode="numeric" placeholder="Ej.: 1"></label><p><button id="load" class="btn">Cargar intervenciones</button></p><div id="msg" class="small"></div><div id="cards" class="grid"></div><section id="edit" class="card panel"><h2 id="title"></h2><label>Medición<select id="measurement"><option>M1</option><option>M2</option><option>M3</option></select></label><label>Estado<select id="state"><option value="approved">Aprobada</option><option value="in_progress">En ejecución</option><option value="completed">Completada</option><option value="reprogrammed">Reprogramada</option><option value="suspended">Suspendida</option></select></label><label>Avance %<input id="progress" type="number" min="0" max="100"></label><label>Evidencia / verificación<textarea id="evidence" rows="3"></textarea></label><label>Ajuste o acuerdo<textarea id="adjustment" rows="3"></textarea></label><p><button id="save" class="btn">Registrar seguimiento</button></p><div id="saveMsg" class="small"></div><div id="history"></div></section></main><script>const API='https://convivencia-escolar-api.onrender.com';let active=null;const params=new URLSearchParams(location.search);if(params.get('establishment_id'))eid.value=params.get('establishment_id');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function loadInterventions(){cards.innerHTML='';msg.textContent='Cargando…';try{const r=await fetch(API+'/api/pgce/interventions?establishment_id='+encodeURIComponent(eid.value)),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'load_failed');msg.textContent=d.interventions.length?d.interventions.length+' intervención(es) encontrada(s).':'No hay intervenciones registradas.';cards.innerHTML=d.interventions.map(x=>'<article class="card"><span class="tag">'+esc(x.dimension_code)+'</span><h3>'+esc(x.indicator)+'</h3><p>'+esc(x.target)+'</p><p class="small">Responsable: '+esc(x.responsible)+' · '+esc(x.start_date).slice(0,10)+' → '+esc(x.end_date).slice(0,10)+'<br>Estado: '+esc(x.status)+'</p><button class="btn" onclick="openOne('+Number(x.id)+',\''+esc(x.dimension_code)+'\')">Seguimiento</button></article>').join('')}catch(e){msg.textContent='Error: '+e.message}};load.onclick=loadInterventions;if(eid.value)loadInterventions();async function openOne(id,dim){active=id;title.textContent='Intervención '+dim+' · #'+id;edit.classList.add('open');await historyLoad();edit.scrollIntoView({behavior:'smooth'})}async function historyLoad(){history.innerHTML='<p class="small">Cargando historial…</p>';try{const r=await fetch(API+'/api/pgce/interventions/'+active+'/updates?establishment_id='+encodeURIComponent(eid.value)),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'history_failed');history.innerHTML='<h3>Historial</h3>'+(d.updates.length?d.updates.map(x=>'<div class="bar"><strong>'+esc(x.measurement_code||'—')+' · '+esc(x.status)+'</strong><br>Avance: '+esc(x.progress_percent??'—')+'%<br><span class="small">'+esc(x.evidence_note||'Sin evidencia textual')+(x.adjustment_note?'<br>Ajuste: '+esc(x.adjustment_note):'')+'</span></div>').join(''):'<p class="small">Aún no hay seguimientos.</p>')}catch(e){history.textContent='No fue posible cargar historial: '+e.message}}save.onclick=async()=>{if(!active)return;saveMsg.textContent='Guardando…';try{const payload={measurement_code:measurement.value,status:state.value,progress_percent:progress.value===''?null:Number(progress.value),evidence_note:evidence.value||null,adjustment_note:adjustment.value||null};const r=await fetch(API+'/api/pgce/interventions/'+active+'/updates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'save_failed');saveMsg.textContent='Seguimiento registrado correctamente.';evidence.value='';adjustment.value='';await historyLoad()}catch(e){saveMsg.textContent='Error: '+e.message}};</script></body></html>
