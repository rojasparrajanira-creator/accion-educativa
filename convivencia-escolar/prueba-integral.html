<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba integral · MEC Convivencia</title><style>body{font-family:Inter,Arial,sans-serif;background:#eef9f5;color:#24443c;margin:0}main{max-width:900px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #d5eae3;border-radius:18px;padding:20px;margin:14px 0}.btn{border:0;border-radius:11px;padding:12px 16px;background:#176b5b;color:#fff;font-weight:800;cursor:pointer}.ok{color:#176b5b}.bad{color:#a22}.small{color:#607870;font-size:.9rem}pre{white-space:pre-wrap}</style></head><body><main><h1>Prueba integral técnica · piloto ficticio</h1><div class="card"><p>Comprueba el recorrido establecimiento → curso → estudiante ficticio → M1 → aplicación 7°–8° → persistencia → D01–D16 → agregados de curso e institución.</p><p class="small">Solo crea datos identificados como PRUEBA E2E. No utiliza estudiantes reales.</p><button id="run" class="btn">Ejecutar prueba</button></div><div id="out" class="card">Aún no ejecutada.</div></main><script>
const API='https://convivencia-escolar-api.onrender.com',out=document.getElementById('out'),run=document.getElementById('run');
const j=async(url,opt={})=>{const r=await fetch(API+url,opt),d=await r.json();if(!r.ok||!d.ok)throw Error((d&&d.error)||('HTTP '+r.status));return d};
const post=(u,b)=>j(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
function manifest(){const a=[];for(let i=1;i<=16;i++)a.push({item_code:'D'+String(i).padStart(2,'0')+'_01',value:4});for(let i=1;i<=14;i++)a.push({item_code:'D'+String(i).padStart(2,'0')+'_02',value:4});for(let i=1;i<=10;i++)a.push({item_code:'EXP_'+String(i).padStart(2,'0'),value:1});for(let i=1;i<=3;i++)a.push({item_code:'PAR_'+String(i).padStart(2,'0'),value:4});for(let i=1;i<=4;i++)a.push({item_code:'BIE_'+String(i).padStart(2,'0'),value:4});for(let i=1;i<=3;i++)a.push({item_code:'ESC_'+String(i).padStart(2,'0'),value:4});return a}
run.onclick=async()=>{run.disabled=true;out.textContent='Ejecutando…';const log=[];try{const s=await post('/api/pilot/setup',{});log.push('✓ Establecimiento piloto, curso y M1 disponibles');const stamp=Date.now();const st=await post('/api/students',{establishment_id:s.establishment.id,course_id:s.course.id,name:'PRUEBA E2E '+stamp});log.push('✓ Estudiante ficticio creado: '+st.student.id);const ap=await post('/api/applications',{measurement_id:s.measurement.id,student_id:st.student.id,survey_level:'7-8'});log.push('✓ Aplicación 7°–8° creada: '+ap.application.id);const saved=await post('/api/applications/'+ap.application.id+'/responses',{responses:manifest()});if(saved.saved!==50||saved.status!=='completed')throw Error('persistencia_incompleta');log.push('✓ 50 respuestas obligatorias persistidas y aplicación completada');const r=await j('/api/applications/'+ap.application.id+'/results');if(r.summary.answered!==50||Object.keys(r.dimension_summary||{}).length!==16)throw Error('resultado_individual_incompleto');log.push('✓ Resultado individual recuperado con D01–D16');const cr=await j('/api/courses/'+s.course.id+'/results?measurement_id='+s.measurement.id+'&school_year='+s.measurement.school_year);if(!cr.applications)throw Error('agregado_curso_vacio');log.push('✓ Agregado de curso filtrado por M1 y año');const ir=await j('/api/establishments/'+s.establishment.id+'/results?measurement_id='+s.measurement.id+'&school_year='+s.measurement.school_year);if(!ir.applications)throw Error('agregado_institucional_vacio');log.push('✓ Agregado institucional filtrado por M1 y año');log.push('RESULTADO: PRUEBA INTEGRAL APROBADA');out.innerHTML='<pre class="ok">'+log.join('\n')+'</pre><p><a href="resultados.html?application_id='+ap.application.id+'">Abrir resultados</a> · <a href="informe-individual.html?application_id='+ap.application.id+'">Abrir informe individual</a> · <a href="pgce-priorizacion.html?application_id='+ap.application.id+'">Abrir priorización PGCE</a></p>'}catch(e){log.push('✗ '+e.message);out.innerHTML='<pre class="bad">'+log.join('\n')+'</pre>'}finally{run.disabled=false}};
</script></body></html>
