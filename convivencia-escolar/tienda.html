<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tienda · Material Educativo Chile</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f7fafc;color:#26313d}header{padding:22px 5%;background:#fff;border-bottom:1px solid #e7ebef}main{padding:30px 5%;max-width:1250px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}.p{background:#fff;border:1px solid #e4e9ef;border-radius:18px;overflow:hidden;box-shadow:0 7px 25px #2030400b}.p img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#edf2f5}.b{padding:18px}.muted{color:#73808d}.price{font-size:22px;font-weight:900;margin-top:12px}.old{text-decoration:line-through;font-size:13px;color:#8a949d;margin-left:8px}.tag{font-size:12px;font-weight:800;color:#173e35;background:#eef7f3;padding:5px 8px;border-radius:999px;display:inline-block}details{margin-top:12px}summary{cursor:pointer;font-weight:800}</style></head><body><header><strong>Material Educativo Chile</strong> · Tienda</header><main><h1>Materiales educativos digitales</h1><p class="muted">Recursos seleccionados y publicados por Material Educativo Chile.</p><div id="grid" class="grid"></div></main><script>const API='https://convivencia-escolar-api.onrender.com';const money=v=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(v||0));fetch(API+'/api/store/products').then(r=>r.json()).then(d=>{const ps=d.products||[];document.getElementById('grid').innerHTML=ps.length?ps.map(p=>`<article class="p"><img src="${p.image_url||''}" alt=""><div class="b"><span class="tag">${p.audience||'Material educativo'}</span><h2>${p.title}</h2><p>${p.objective}</p><div class="price">${money(p.price_clp)}${p.compare_at_price_clp?'<span class="old">'+money(p.compare_at_price_clp)+'</span>':''}</div><details><summary>Ver detalle</summary><p>${p.description}</p><strong>Incluye</strong><p>${p.included_materials}</p></details></div></article>`).join(''):'<p class="muted">Próximamente encontrarás aquí los materiales publicados.</p>'}).catch(()=>document.getElementById('grid').innerHTML='<p class="muted">No fue posible cargar el catálogo.</p>')</script></body></html>
