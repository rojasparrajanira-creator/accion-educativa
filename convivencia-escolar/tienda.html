<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tienda · Material Educativo Chile</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f7fafc;color:#26313d}header{padding:22px 5%;background:#fff;border-bottom:1px solid #e7ebef}main{padding:30px 5%;max-width:1250px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}.p{background:#fff;border:1px solid #e4e9ef;border-radius:18px;overflow:hidden;box-shadow:0 7px 25px #2030400b}.p img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#edf2f5}.b{padding:18px}.muted{color:#73808d}.price{font-size:22px;font-weight:900;margin-top:12px}.old{text-decoration:line-through;font-size:13px;color:#8a949d;margin-left:8px}.tag{font-size:12px;font-weight:800;color:#173e35;background:#eef7f3;padding:5px 8px;border-radius:999px;display:inline-block}details{margin-top:12px}summary{cursor:pointer;font-weight:800}button{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;background:#173e35;color:#fff}.cart{position:fixed;right:18px;bottom:18px;background:#fff;border:1px solid #dfe5ea;border-radius:16px;padding:16px;box-shadow:0 10px 35px #20304022;max-width:330px;width:calc(100% - 36px)}.cart input{width:100%;padding:10px;margin:5px 0;border:1px solid #ccd5dd;border-radius:9px}.cart ul{padding-left:18px}</style></head><body><header><strong>Material Educativo Chile</strong> · Tienda</header><main><h1>Materiales educativos digitales</h1><p class="muted">Recursos seleccionados y publicados por Material Educativo Chile.</p><div id="grid" class="grid"></div></main><aside class="cart"><strong>Mi compra</strong><ul id="cart"></ul><input id="buyerName" placeholder="Nombre y apellido"><input id="buyerEmail" type="email" placeholder="Correo electrónico"><button id="orderBtn">Continuar al pago</button><p id="cartMsg" class="muted"></p></aside><script>
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
let cart=[];function addCart(id,title){if(!cart.some(x=>x.product_id===id))cart.push({product_id:id,quantity:1,title});renderCart()}function renderCart(){document.getElementById('cart').innerHTML=cart.length?cart.map(x=>'<li>'+esc(x.title)+' × '+(x.quantity||1)+'</li>').join(''):'<li>Sin productos</li>'}async function createOrder(){const m=document.getElementById('cartMsg');if(!cart.length){m.textContent='Agrega al menos un material.';return}m.textContent='Creando pedido…';try{const r=await fetch(API+'/api/store/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({buyer_name:document.getElementById('buyerName').value,buyer_email:document.getElementById('buyerEmail').value,items:cart})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');m.textContent='Pedido '+d.order.order_code+' creado. El pago Webpay se habilitará en la siguiente etapa.'}catch(e){m.textContent='No se pudo crear el pedido: '+e.message}}document.addEventListener('click',e=>{if(e.target.matches('[data-buy]'))addCart(Number(e.target.dataset.buy),e.target.dataset.title)});setTimeout(()=>{document.getElementById('orderBtn').onclick=createOrder;renderCart()},0);const API='https://convivencia-escolar-api.onrender.com';const money=v=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(v||0));fetch(API+'/api/store/products').then(r=>r.json()).then(d=>{const ps=d.products||[];document.getElementById('grid').innerHTML=ps.length?ps.map(p=>`<article class="p"><img src="${p.image_url||''}" alt=""><div class="b"><span class="tag">${esc(p.audience||'Material educativo')}</span><h2>${esc(p.title)}</h2><p>${esc(p.objective)}</p><div class="price">${money(p.price_clp)}${p.compare_at_price_clp?'<span class="old">'+money(p.compare_at_price_clp)+'</span>':''}</div><details><summary>Ver detalle</summary><p>${esc(p.description)}</p><strong>Incluye</strong><p>${esc(p.included_materials)}</p></details><button data-buy="${p.id}" data-title="${esc(p.title)}">Agregar</button></div></article>`).join(''):'<p class="muted">Próximamente encontrarás aquí los materiales publicados.</p>'}).catch(()=>document.getElementById('grid').innerHTML='<p class="muted">No fue posible cargar el catálogo.</p>')</script></body></html>
