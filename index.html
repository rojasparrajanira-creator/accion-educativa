const uuid=()=>{if(globalThis.crypto?.randomUUID)return globalThis.uuid();const b=new Uint8Array(16);if(globalThis.crypto?.getRandomValues)globalThis.crypto.getRandomValues(b);else for(let i=0;i<16;i++)b[i]=Math.floor(Math.random()*256);b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`};
function distance(a,b){a=norm(a);b=norm(b);const m=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t}}return m[b.length]}
function fuzzy(q,text){if(!q)return true;q=norm(q);text=norm(text);if(text.includes(q))return true;return text.split(/\s+/).some(w=>w.length>3&&distance(q,w)<=Math.max(1,Math.floor(q.length*.3)))}

function categoriesPage(){return `${header('',true)}<main class="section"><div class="container"><div class="breadcrumb"><a href="#/">⌂ Inicio</a> › Categorías</div><h1 class="page-title">Categorías educativas</h1><p class="page-subtitle">Explora los materiales disponibles por área de trabajo.</p><div class="category-grid" style="margin-top:28px">${state.categories.map(c=>`<a class="category-card" href="#/categoria/${c.slug}"><span class="category-icon">${c.icon||'📘'}</span><b>${esc(c.name)}</b><small>${c.productCount||0} recursos</small></a>`).join('')}</div></div></main>${footer()}`}
function parseQuery(){return Object.fromEntries(new URLSearchParams((location.hash.split('?')[1]||'')))}
function filterProducts(products,q={}){let r=[...products];if(q.q)r=r.filter(p=>fuzzy(q.q,[p.title,p.shortDescription,p.category?.name,p.subcategory,(p.tags||[]).join(' '),(p.levels||[]).join(' ')].join(' ')));if(q.category)r=r.filter(p=>p.category?.slug===q.category);if(q.level)r=r.filter(p=>(p.levels||[]).includes(q.level));if(q.format)r=r.filter(p=>(p.formats||[]).includes(q.format));if(q.type)r=r.filter(p=>p.resourceType===q.type);if(q.subtopic)r=r.filter(p=>norm(p.subcategory).includes(norm(q.subtopic))||norm((p.tags||[]).join(' ')).includes(norm(q.subtopic)));if(q.sort==='recent')r.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));else if(q.sort==='price_asc')r.sort((a,b)=>a.priceClp-b.priceClp);else if(q.sort==='price_desc')r.sort((a,b)=>b.priceClp-a.priceClp);else r.sort((a,b)=>(b.salesCount||0)-(a.salesCount||0));return r}
function catalog(){const q=parseQuery();const products=filterProducts(allProducts(),q);return `${header('',true)}<main><section class="catalog-hero"><div class="container"><div class="breadcrumb"><a href="#/">⌂ Inicio</a> › Catálogo de materiales</div><h1 class="page-title">Catálogo de materiales</h1><p class="page-subtitle">Explora, busca y encuentra recursos pedagógicos de calidad para tus clases.</p><form class="search-bar" onsubmit="event.preventDefault();applyCatalogSearch()"><input id="catalog-search" value="${esc(q.q||'')}" placeholder="Buscar por nombre, categoría, nivel o palabra clave..."><button>⌕ Buscar</button></form><div class="quick-chips">${state.categories.slice(0,8).map(c=>`<button class="quick-chip" onclick="setCatalogParam('category','${c.slug}')">${c.icon||'📘'} ${esc(c.name)}</button>`).join('')}</div></div></section><section class="section"><div class="container catalog-layout"><aside class="filter-card"><h3>Filtrar resultados ⚙</h3>${filterFields(q)}<button class="filter-reset" onclick="location.hash='#/catalogo'">↻ Limpiar filtros</button></aside><div><div class="result-head"><b>Mostrando ${products.length} materiales</b><label>Ordenar por: <select onchange="setCatalogParam('sort',this.value)"><option value="best" ${q.sort==='best'?'selected':''}>Más vendidos</option><option value="recent" ${q.sort==='recent'?'selected':''}>Más recientes</option><option value="price_asc" ${q.sort==='price_asc'?'selected':''}>Menor precio</option><option value="price_desc" ${q.sort==='price_desc'?'selected':''}>Mayor precio</option></select></label></div><div class="products-grid">${products.length?products.map(productCard).join(''):'<div class="empty">No encontramos materiales. Prueba otra palabra o limpia los filtros.</div>'}</div></div></div></section></main>${footer()}`}
function filterFields(q){
  const opts=(arr,val)=>`<option value="">Todos</option>${arr.map(x=>`<option value="${esc(x.value??x)}" ${val===(x.value??x)?'selected':''}>${esc(x.label??x)}</option>`).join('')}`;
  return `<div class="filter-field"><label>Categoría</label><select onchange="setCatalogParam('category',this.value)">${opts(state.categories.map(c=>({value:c.slug,label:c.name})),q.category)}</select></div><div class="filter-field"><label>Nivel</label><select onchange="setCatalogParam('level',this.value)">${opts(LEVELS,q.level)}</select></div><div class="filter-field"><label>Tipo de recurso</label><select onchange="setCatalogParam('type',this.value)">${opts(TYPES,q.type)}</select></div><div class="filter-field"><label>Formato</label><select onchange="setCatalogParam('format',this.value)">${opts(FORMATS,q.format)}</select></div>`
}

function setCatalogParam(k,v){const q=parseQuery();if(v)q[k]=v;else delete q[k];location.hash='#/catalogo?'+new URLSearchParams(q).toString()}function applyCatalogSearch(){setCatalogParam('q',$('#catalog-search').value.trim())}
function categoryPage(slug){const cat=state.categories.find(c=>c.slug===slug);if(!cat)return notFound();const q=parseQuery();q.category=slug;const products=filterProducts(allProducts(),q);return `${header('',true)}<main class="section"><div class="container"><div class="breadcrumb"><a href="#/">⌂ Inicio</a> › <a href="#/categorias">Categorías</a> › ${esc(cat.name)}</div><div class="category-banner"><div><h1 class="page-title">${esc(cat.name)}</h1><p class="page-subtitle">${esc(cat.description)}</p><div class="subtopics">${cat.subcategories.map(s=>`<button class="subtopic" onclick="setCategorySubtopic('${slug}','${esc(s).replaceAll("'","\\'")}')">${esc(s)}</button>`).join('')}</div></div><div style="position:relative"><img src="${esc(cat.heroImage||AS+'categoria-convivencia.webp')}" alt="${esc(cat.name)}"><span class="badge" style="top:auto;bottom:15px;font-size:14px">📁 ${products.length} recursos disponibles</span></div></div><div class="catalog-layout"><aside><div class="filter-card"><h3>Filtrar resultados ⚙</h3>${filterFields(q).replace(/<div class="filter-field"><label>Categoría[\s\S]*?<\/div>/,'')}<button class="filter-reset" onclick="location.hash='#/categoria/${slug}'">↻ Limpiar filtros</button></div><div class="info-card" style="margin-top:12px"><h3>¿Qué incluye esta categoría?</h3><p>✓ Talleres listos para aplicar</p><p>✓ Cuadernillos descargables</p><p>✓ Materiales para docentes y estudiantes</p></div></aside><div><div class="result-head"><h2>Materiales de ${esc(cat.name.toLowerCase())}</h2><label>Ordenar: <select onchange="setCategorySort('${slug}',this.value)"><option value="best">Más vendidos</option><option value="recent" ${q.sort==='recent'?'selected':''}>Más recientes</option><option value="price_asc" ${q.sort==='price_asc'?'selected':''}>Menor precio</option></select></label></div><div class="products-grid">${products.length?products.map(productCard).join(''):'<div class="empty">Aún no hay recursos con estos filtros.</div>'}</div></div></div></div></main>${footer()}`}
function setCategorySubtopic(slug,s){location.hash=`#/categoria/${slug}?subtopic=${encodeURIComponent(s)}`}function setCategorySort(slug,s){const q=parseQuery();q.sort=s;location.hash=`#/categoria/${slug}?${new URLSearchParams(q)}`}
function detail(slug){const p=allProducts().find(x=>x.slug===slug);if(!p)return notFound();const related=allProducts().filter(x=>x.id!==p.id&&(x.category?.slug===p.category?.slug||(x.levels||[]).some(l=>(p.levels||[]).includes(l)))).slice(0,4);return `${header('',true)}<main class="section"><div class="container"><div class="breadcrumb"><a href="#/">⌂ Inicio</a> › <a href="#/categorias">Categorías</a> › <a href="#/categoria/${p.category?.slug}">${esc(p.category?.name)}</a> › ${esc(p.title)}</div><div class="detail-grid"><div class="detail-media"><img class="main-cover" src="${esc(p.slug==='conociendo-mis-emociones'?AS+'producto-emociones-portada.webp':p.coverUrl)}" alt="${esc(p.title)}"><div class="preview-row">${(p.previewImages?.length?p.previewImages:[p.coverUrl,p.coverUrl,p.coverUrl]).slice(0,3).map(x=>`<img src="${esc(x)}" alt="Vista previa">`).join('')}</div></div><aside class="detail-panel"><div class="product-category">${esc(p.category?.name)}</div><h1>${esc(p.title)}</h1><p>${esc(p.shortDescription)}</p><div class="detail-price">${clp(p.priceClp)}</div><div class="meta-row">${(p.levels||[]).slice(0,3).map(l=>`<span class="meta-chip">👥 ${esc(l)}</span>`).join('')}${(p.formats||[]).map(f=>`<span class="meta-chip">📄 ${esc(f)}</span>`).join('')}<span class="meta-chip">☁ Descarga inmediata</span></div><ul class="feature-list">${(p.includes||[]).slice(0,6).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="detail-actions"><button class="primary-btn" onclick="addCart('${p.id}')">🛒 Agregar al carrito</button><button class="outline-btn" onclick="buyNow('${p.id}')">Comprar ahora</button></div></aside></div><div class="detail-info-grid"><div class="detail-info"><h3>📝 Descripción</h3><p class="justified">${esc(p.description)}</p></div><div class="detail-info"><h3>⭐ ¿Qué incluye?</h3><ul>${(p.includes||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="detail-info"><h3>🎯 Objetivo</h3><p class="justified">${esc(p.objective)}</p></div><div class="detail-info"><h3>👥 Dirigido a</h3><p class="justified">${esc(p.targetAudience)}</p></div></div><div class="section-head" style="margin-top:32px"><h2>También te puede interesar</h2><button class="link-btn" onclick="location.hash='#/categoria/${p.category?.slug}'">Ver todos →</button></div><div class="products-grid">${related.map(productCard).join('')}</div></div></main>${footer()}`}
function buyNow(id){const p=allProducts().find(x=>x.id===id);state.cart=[{id:p.id,slug:p.slug,title:p.title,priceClp:p.priceClp,coverUrl:p.coverUrl,quantity:1}];saveCart();location.hash='#/checkout'}
function cartPage(){const total=state.cart.reduce((s,i)=>s+i.priceClp*i.quantity,0);return `${header('',true)}<main class="section"><div class="container"><div class="breadcrumb"><a href="#/">⌂ Inicio</a> › Carrito</div><h1 class="page-title">Tu carrito</h1><div class="cart-layout"><div class="cart-items">${state.cart.length?state.cart.map(i=>`<div class="cart-item"><img src="${esc(i.coverUrl)}"><div><b>${esc(i.title)}</b><div class="muted">Cantidad: ${i.quantity}</div><button class="remove-btn" onclick="removeCart('${i.id}')">Eliminar</button></div><strong>${clp(i.priceClp*i.quantity)}</strong></div>`).join(''):'<div class="empty">Tu carrito está vacío.</div>'}</div><aside class="summary-card"><h2>Resumen</h2><div class="summary-row"><span>Productos</span><b>${state.cart.reduce((s,i)=>s+i.quantity,0)}</b></div><div class="summary-row summary-total"><span>Total</span><b>${clp(total)}</b></div><button class="primary-btn" style="width:100%" ${state.cart.length?'onclick="location.hash=\'#/checkout\'"':'disabled'}>Continuar compra</button></aside></div></div></main>${footer()}`}
function removeCart(id){state.cart=state.cart.filter(i=>i.id!==id);saveCart();render()}
function checkout(){if(!state.cart.length){location.hash='#/carrito';return''}const total=state.cart.reduce((s,i)=>s+i.priceClp*i.quantity,0);return `${header('',true)}<main class="section"><div class="container"><div class="breadcrumb"><a href="#/carrito">Carrito</a> › Confirmar compra</div><h1 class="page-title">Confirmar compra</h1><div class="checkout-grid"><div class="checkout-card"><h2>Datos para enviar tu enlace</h2><form id="checkout-form" onsubmit="processCheckout(event)"><label>Nombre completo<input required id="buyer-name" autocomplete="name" placeholder="Ej.: Yanira Rojas"></label><label>Correo electrónico<input required id="buyer-email" type="email" autocomplete="email" placeholder="correo@ejemplo.cl"></label><label><input required type="checkbox" style="width:auto"> Confirmo que el correo es correcto y que será usado para acceder a mis materiales.</label><button class="primary-btn" id="pay-button">Pagar ${clp(total)}</button><small class="muted">El proyecto incluye un modo de pago de prueba. Para cobrar dinero real se debe configurar el proveedor de pago contratado.</small></form></div><aside class="summary-card"><h2>Tu pedido</h2>${state.cart.map(i=>`<div class="summary-row"><span>${esc(i.title)}</span><b>${clp(i.priceClp*i.quantity)}</b></div>`).join('')}<div class="summary-row summary-total"><span>Total pagado</span><b>${clp(total)}</b></div></aside></div></div></main>${footer()}`}
async function processCheckout(e){
  e.preventDefault();
  const btn=$('#pay-button');btn.disabled=true;btn.textContent='Procesando...';
  const fullName=$('#buyer-name').value.trim(),email=$('#buyer-email').value.trim();
  try{
    const d=await api('/api/store/checkout',{method:'POST',body:JSON.stringify({fullName,email,items:state.cart.map(i=>({productId:i.id,quantity:i.quantity}))})});
    localStorage.setItem('mec_last_order',JSON.stringify({...d.order,items:state.cart,magicUrl:d.magicUrl,emailSent:d.emailSent}));
    state.cart=[];saveCart();location.hash='#/compra-confirmada';
  }catch(err){
    if(state.apiOnline){btn.disabled=false;btn.textContent='Reintentar pago';toast(err.message,'error');return}
    const token=uuid();
    const order={orderNumber:'MEC-DEMO-'+Date.now().toString().slice(-7),totalClp:state.cart.reduce((s,i)=>s+i.priceClp*i.quantity,0),fullName,email,items:[...state.cart],token,magicUrl:`#/biblioteca/${token}`,emailSent:false};
    const orders=JSON.parse(localStorage.getItem('mec_demo_orders')||'[]');orders.unshift(order);
    localStorage.setItem('mec_demo_orders',JSON.stringify(orders));localStorage.setItem('mec_last_order',JSON.stringify(order));
    state.cart=[];saveCart();location.hash='#/compra-confirmada';toast('Compra registrada en modo de demostración.','success');
  }
}

function confirmation(){const o=JSON.parse(localStorage.getItem('mec_last_order')||'null');if(!o)return notFound();return `${header('',true)}<main><div class="success-shell"><div class="success-icon">✓</div><h1>Tu compra fue realizada con éxito</h1><p>Hemos asociado tu acceso automáticamente al correo ingresado.</p><div class="info-card" style="background:#eef7ff">✉ Te enviaremos un correo con un enlace seguro para que accedas a tus materiales.</div><table class="order-table">${o.items.map(i=>`<tr><td>${esc(i.title)}</td><td>${clp(i.priceClp*i.quantity)}</td></tr>`).join('')}<tr><td>Número de pedido</td><td>${esc(o.orderNumber)}</td></tr><tr><td>Correo</td><td>${esc(o.email||'')}</td></tr><tr><td><b>Total pagado</b></td><td><b>${clp(o.totalClp)}</b></td></tr></table><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="outline-btn" onclick="location.hash='#/'">Volver al inicio</button><button class="primary-btn" onclick="showEmailStep()">Ver envío del enlace</button></div></div></main>${footer()}`}
function showEmailStep(){location.hash='#/correo-enviado'}
function emailSentPage(){const o=JSON.parse(localStorage.getItem('mec_last_order')||'null');if(!o)return notFound();const link=o.magicUrl?.startsWith('http')?o.magicUrl.replace(location.origin,''):o.magicUrl||`#/biblioteca/${o.token}`;return `${header('',true)}<main><div class="success-shell"><div style="font-size:66px">✉</div><h1>Hola, ${esc(o.fullName||o.email)} 👋</h1><p>Gracias por tu compra. <b>Tu enlace ha sido activado</b> y ya puedes acceder a tus materiales.</p><div class="info-card"><p><b>Correo:</b> ${esc(o.email||'')}</p><p><b>Pedido:</b> ${esc(o.orderNumber)}</p></div><a class="primary-btn" href="${esc(link)}">Enviar enlace / Ir a mis materiales</a><p class="muted">Este enlace es personal y seguro.</p></div></main>${footer()}`}
async function library(token){
  let data;
  try{data=await api('/api/store/access/'+encodeURIComponent(token))}
  catch(err){
    if(state.apiOnline)return `${header('',true)}<main class="section"><div class="container"><div class="empty">${esc(err.message||'El enlace no es válido o ya no está disponible.')}</div></div></main>${footer()}`;
    const orders=JSON.parse(localStorage.getItem('mec_demo_orders')||'[]');
    const accessOrder=orders.find(x=>x.token===token);
    if(accessOrder){
      const all=orders.filter(x=>String(x.email).toLowerCase()===String(accessOrder.email).toLowerCase());
      const seen=new Set(),items=[];
      all.forEach(o=>(o.items||[]).forEach(i=>{if(!seen.has(i.id)){seen.add(i.id);items.push({...i,productId:i.id})}}));
      data={customer:{fullName:accessOrder.fullName,email:accessOrder.email},order:{...accessOrder,orderCount:all.length,totalClp:all.reduce((s,o)=>s+Number(o.totalClp||0),0)},items};
    }
  }
  if(!data)return `${header('',true)}<main class="section"><div class="container"><div class="empty">El enlace no es válido o ya no está disponible.</div></div></main>${footer()}`;
  return `${header('',true)}<main class="library-shell"><div class="library-head"><h1>Bienvenida, ${esc(data.customer.fullName)} 👋</h1><p>Aquí puedes ver y descargar todos los materiales asociados a tus compras.</p></div><div class="library-list"><div class="section-head"><h2>Mis materiales</h2><span>${data.items.length} materiales · ${data.order.orderCount||1} pedido(s)</span></div>${data.items.map(i=>`<article class="library-item"><img src="${esc(i.coverUrl||AS+'producto-emociones.webp')}"><div><h3>${esc(i.title)}</h3><div class="meta-row">${(i.formats||['PDF']).map(f=>`<span class="meta-chip">${esc(f)}</span>`).join('')}<span class="status paid">Comprado</span></div><p class="muted">${esc(i.shortDescription||'Material disponible para descarga.')}</p></div><div class="library-actions"><button class="primary-btn" onclick="location.hash='#/material/${esc(i.slug||allProducts().find(p=>p.id===i.productId)?.slug||'')}'">Ver material</button><button class="outline-btn" onclick="downloadMaterial('${token}','${i.productId||i.id}','${esc(i.title).replaceAll("'","\\'")}')">⬇ Descargar</button></div></article>`).join('')}</div></main>${footer()}`
}
async function downloadMaterial(token,productId,title){try{const d=await api(`/api/store/access/${token}/products/${productId}/files`);if(d.files?.length){if(d.files.length===1)return location.href=`/api/store/download/${token}/${productId}/${d.files[0].id}`;modal(`<h2>Descargar ${esc(title)}</h2>${d.files.map(f=>`<p><a class="outline-btn" style="width:100%" href="/api/store/download/${token}/${productId}/${f.id}">⬇ ${esc(f.label)}</a></p>`).join('')}<div class="modal-actions"><button class="outline-btn" onclick="closeModal()">Cerrar</button></div>`);return}if(state.apiOnline){toast('Este material todavía no tiene archivos descargables.','error');return}}catch(err){if(state.apiOnline){toast(err.message||'No fue posible descargar el material.','error');return}}const blob=new Blob([`Material Educativo Chile\n\n${title}\n\nArchivo demostrativo. Los documentos reales se incorporan desde el panel de Superadministración.`],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=norm(title).replace(/[^a-z0-9]+/g,'-')+'.txt';a.click();URL.revokeObjectURL(a.href);toast('Descarga de demostración iniciada.')}
function notFound(){return `${header('',true)}<main class="section"><div class="container empty"><h1>Página no encontrada</h1><a class="primary-btn" href="#/">Volver al inicio</a></div></main>${footer()}`}
function adminSidebar(active){const links=[['Panel principal','#/admin','⌂'],['Productos','#/admin/productos','📦'],['Subir recurso','#/admin/subir-recurso','☁'],['Packs','#/admin/packs','🧊'],['Pedidos','#/admin/pedidos','🛒'],['Pagos','#/admin/pagos','💳'],['Compradores','#/admin/compradores','👥'],['Reportes','#/admin/reportes','📊'],['Configuración','#/admin/configuracion','⚙']];return `<aside class="admin-sidebar" id="admin-sidebar"><div class="admin-brand"><img src="${AS}logo-oficial.png"><b>Material<br>Educativo Chile</b></div><nav class="admin-nav">${links.map(l=>`<a class="${active===l[0]?'active':''}" href="${l[1]}"><span>${l[2]}</span>${l[0]}</a>`).join('')}<div class="admin-collapse"><a href="#/" onclick="adminLogout()">↩ Cerrar sesión</a></div></nav></aside>`}
function adminTop(){return `<div class="admin-topbar"><div class="admin-search"><span>⌕</span><input placeholder="Buscar recursos, talleres, categorías..." onkeydown="if(event.key==='Enter'){location.hash='#/admin/productos?q='+encodeURIComponent(this.value)}"></div><div class="admin-user"><button class="icon-btn" onclick="location.hash='#/'">👁</button><span class="admin-avatar">👤</span>${esc(state.adminUser?.fullName||'Superadministrador')}</div></div>`}
function adminWrap(active,body){return `<div class="admin-shell">${adminSidebar(active)}<div class="admin-main">${adminTop()}<main class="admin-content">${body}</main></div></div>`}
function adminLogin(){return `<main class="login-page"><div class="login-card"><img src="${AS}logo-oficial.png"><h1>Superadministrador</h1><p class="muted">Acceso exclusivo para la gestión de Material Educativo Chile.</p><form onsubmit="adminSignIn(event)"><label>RUT<input id="admin-rut" required placeholder="12.345.678-9"></label><label>Contraseña<input id="admin-pass" required type="password" minlength="10"></label><button class="primary-btn">Ingresar</button></form><button class="link-btn" style="width:100%;margin-top:14px" onclick="showSetupAdmin()">Crear primera cuenta de superadministración</button><p class="muted" style="font-size:12px">El modo local permite revisar la interfaz. En producción solo ingresa la cuenta de Superadministración creada con la clave inicial.</p></div></main>`}
async function adminSignIn(e){
  e.preventDefault();const rut=$('#admin-rut').value,password=$('#admin-pass').value;
  try{
    const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({rut,password})});
    if(d.user.role!=='superadmin')throw new Error('Esta cuenta no es Superadministrador.');
    state.adminToken=d.token;state.adminUser=d.user;localStorage.setItem('mec_admin_token',d.token);localStorage.setItem('mec_admin_user',JSON.stringify(d.user));location.hash='#/admin';
  }catch(err){
    if(state.apiOnline){toast(err.message,'error');return}
    state.adminToken='demo-token';state.adminUser={fullName:'Superadministrador Demo',role:'superadmin'};
    localStorage.setItem('mec_admin_token',state.adminToken);localStorage.setItem('mec_admin_user',JSON.stringify(state.adminUser));toast('Ingreso en modo local de demostración.');location.hash='#/admin';
  }
}

async function adminDashboard(){const d=await loadAdminDashboard();const max=Math.max(1,...d.series.map(x=>x.sales));return adminWrap('Panel principal',`<h1>Panel de control</h1><p class="admin-sub">Gestión general de la tienda educativa.</p><div class="kpi-grid"><div class="kpi-card"><div class="kpi-icon">📖</div><div><span>Productos y packs publicados</span><br><b>${d.kpis.products+d.kpis.packs}</b></div></div><div class="kpi-card" onclick="location.hash='#/admin/reportes'" style="cursor:pointer"><div class="kpi-icon" style="background:#def8f4;color:#049C9B">$</div><div><span>Ventas del mes</span><br><b>${clp(d.kpis.monthSales)}</b><small>${d.kpis.monthOrders} pedidos</small></div></div><div class="kpi-card"><div class="kpi-icon" style="background:#fff3ce;color:#ad7e00">✓</div><div><span>Pagos recibidos</span><br><b>${d.kpis.monthOrders}</b></div></div></div><div class="admin-grid"><section class="admin-panel"><h3>Resumen de ventas y descargas</h3><div class="chart">${d.series.map(x=>`<div class="bar" style="height:${Math.max(4,x.sales/max*100)}%" data-tip="${clp(x.sales)}"></div>`).join('')}</div></section><section class="admin-panel"><h3>Acciones rápidas</h3><div class="quick-actions"><a class="quick-action" href="#/admin/subir-recurso"><span>☁ Subir archivos<br><small class="muted">Publicar un recurso en el catálogo</small></span>›</a><a class="quick-action" href="#/admin/packs"><span>🧊 Crear pack<br><small class="muted">Agrupar materiales existentes</small></span>›</a></div></section></div><section class="admin-panel" style="margin-top:20px"><h3>Últimos materiales</h3>${productTable(d.recentProducts)}</section>`)}

async function adminProducts(){let products;try{products=(await api('/api/store-admin/products')).products}catch{products=allProducts()}return adminWrap('Productos',`<div class="section-head"><div><h1>Productos</h1><p class="admin-sub">Todos los materiales organizados por curso, categoría y estado.</p></div><a class="primary-btn" href="#/admin/subir-recurso">☁ Subir recurso</a></div><section class="admin-panel"><div class="quick-chips" style="margin-bottom:14px">${LEVELS.slice(0,14).map(l=>`<button class="quick-chip" onclick="filterAdminProducts('${esc(l).replaceAll("'","\\'")}')">${l}</button>`).join('')}</div><div id="admin-products-table">${productTable(products)}</div></section>`)}
function filterAdminProducts(level){const p=allProducts().filter(x=>(x.levels||[]).includes(level));$('#admin-products-table').innerHTML=productTable(p)}
async function toggleProductStatus(id,status){
  try{await api('/api/store-admin/products/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});await loadData();toast('Estado actualizado.');render()}
  catch(err){
    if(state.apiOnline){toast(err.message,'error');return}
    const p=state.localProducts.find(x=>x.id===id)||state.products.find(x=>x.id===id);if(p)p.status=status;
    localStorage.setItem('mec_local_products',JSON.stringify(state.localProducts));toast('Estado actualizado en modo local.');render();
  }
}

function uploadPage(){const q=parseQuery(),p=q.id?allProducts().find(x=>x.id===q.id):null;return adminWrap('Subir recurso',`<div><h1>${p?'Editar':'Cargar nuevo'} recurso educativo</h1><p class="admin-sub">Completa la información. Al publicar, aparecerá automáticamente en el catálogo, categoría, buscador y filtros.</p></div><div class="upload-layout"><form class="upload-form" id="resource-form" onsubmit="saveResource(event,'published')"><div class="form-section"><h3><span class="step">1</span> Información general</h3><div class="form-grid"><div class="form-field"><label>Área o categoría</label><select id="res-category" required>${state.categories.map(c=>`<option value="${c.slug}" ${p?.category?.slug===c.slug?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="form-field"><label>Subcategoría o temática</label><input id="res-subcategory" value="${esc(p?.subcategory||'')}" placeholder="Ej.: Educación emocional"></div><div class="form-field"><label>Nombre del recurso o taller</label><input id="res-title" required value="${esc(p?.title||'')}"></div><div class="form-field"><label>Valor (CLP)</label><input id="res-price" required type="number" min="0" value="${p?.priceClp||''}" placeholder="5990"></div><div class="form-field full"><label>Objetivo del recurso</label><textarea id="res-objective">${esc(p?.objective||'')}</textarea></div><div class="form-field full"><label>Descripción breve</label><textarea id="res-short" required>${esc(p?.shortDescription||'')}</textarea></div><div class="form-field full"><label>Descripción completa</label><textarea id="res-description">${esc(p?.description||'')}</textarea></div><div class="form-field full"><label>Dirigido a</label><textarea id="res-target">${esc(p?.targetAudience||'')}</textarea></div></div></div><div class="form-section"><h3><span class="step">2</span> Detalles del material</h3><div class="form-field"><label>¿Qué incluye? (una línea por elemento)</label><textarea id="res-includes">${esc((p?.includes||[]).join('\n'))}</textarea></div><div class="form-field"><label>Niveles educativos</label><div class="check-grid">${LEVELS.map(l=>`<label class="check-option"><input type="checkbox" name="res-level" value="${esc(l)}" ${(p?.levels||[]).includes(l)?'checked':''}> ${esc(l)}</label>`).join('')}</div></div><div class="form-field"><label>Tipo de recurso</label><select id="res-type">${TYPES.map(t=>`<option ${p?.resourceType===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="form-field"><label>Formatos</label><div class="check-grid">${FORMATS.map(f=>`<label class="check-option"><input type="checkbox" name="res-format" value="${f}" ${(p?.formats||[]).includes(f)?'checked':''}> ${f}</label>`).join('')}</div></div><div class="form-field"><label>Etiquetas (separadas por coma)</label><input id="res-tags" value="${esc((p?.tags||[]).join(', '))}"></div></div><div class="form-section"><h3><span class="step">3</span> Carga de archivos</h3><div class="form-grid"><div class="form-field"><label>Cargar portada</label><input id="res-cover" type="file" accept="image/*" onchange="previewCover(this)"></div><div class="form-field"><label>Vistas previas</label><input id="res-previews" type="file" accept="image/*" multiple></div><div class="form-field full"><label>Documentos y material complementario</label><div class="file-drop"><input id="res-files" type="file" multiple onchange="showFiles(this)"><p>Arrastra o selecciona PDF, Word, PPT, imágenes, ZIP y anexos.</p></div><div class="file-list" id="file-list"></div></div></div></div><input type="hidden" id="res-id" value="${p?.id||''}"><input type="hidden" id="existing-cover" value="${esc(p?.coverUrl||'')}"><div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><button type="button" class="outline-btn" onclick="location.hash='#/admin/productos'">Cancelar</button><button type="button" class="outline-btn" onclick="saveResource(event,'draft')">Guardar borrador</button><button type="button" class="outline-btn" onclick="showResourcePreview()">👁 Vista previa</button><button class="primary-btn">🚀 Publicar recurso</button></div></form><aside class="preview-card"><h3>Vista previa / publicación</h3><div id="live-preview">${productCard(p||DEMO_PRODUCTS[0])}</div><p class="info-card">ℹ Al publicar, el recurso quedará visible para búsqueda y compra.</p></aside></div>`)}
function showFiles(input){$('#file-list').innerHTML=[...input.files].map(f=>`<div class="file-item"><span>✓ ${esc(f.name)}</span><span>${(f.size/1024/1024).toFixed(2)} MB</span></div>`).join('')}
function previewCover(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#existing-cover').value=r.result;showResourcePreview()};r.readAsDataURL(f)}
function collectResource(status){const levels=$$('input[name="res-level"]:checked').map(x=>x.value),formats=$$('input[name="res-format"]:checked').map(x=>x.value);if(!levels.length)throw new Error('Selecciona al menos un nivel.');if(!formats.length)throw new Error('Selecciona al menos un formato.');return {title:$('#res-title').value.trim(),categorySlug:$('#res-category').value,subcategory:$('#res-subcategory').value.trim(),shortDescription:$('#res-short').value.trim(),description:$('#res-description').value.trim(),objective:$('#res-objective').value.trim(),targetAudience:$('#res-target').value.trim(),includes:$('#res-includes').value.split('\n').map(x=>x.trim()).filter(Boolean),levels,resourceType:$('#res-type').value,formats,tags:$('#res-tags').value.split(',').map(x=>x.trim()).filter(Boolean),priceClp:Number($('#res-price').value||0),coverUrl:$('#existing-cover').value,previewImages:[],status,featured:false,files:[]}}
async function filesToPayload(files,isPreview=false){return Promise.all([...files].map((f,i)=>new Promise((resolve,reject)=>{if(f.size>30*1024*1024)return reject(new Error(f.name+' supera 30 MB.'));const r=new FileReader();r.onload=()=>resolve({label:f.name,fileName:f.name,mimeType:f.type||'application/octet-stream',dataUrl:r.result,isPreview,sortOrder:i});r.onerror=reject;r.readAsDataURL(f)})))}
async function saveResource(e,status){
  e?.preventDefault?.();
  try{
    const data=collectResource(status);
    data.previewImages=await Promise.all([...$('#res-previews').files].map(f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})));
    data.files=await filesToPayload($('#res-files').files,false);
    const id=$('#res-id').value;
    if(status==='published'&&(!data.coverUrl||(!data.files.length&&!id)))throw new Error('Para publicar debes cargar una portada y al menos un archivo descargable.');
    let saved;
    try{
      const d=await api('/api/store-admin/products'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(data)});saved=d.product;await loadData();
    }catch(err){
      if(state.apiOnline)throw err;
      const cat=state.categories.find(c=>c.slug===data.categorySlug);
      saved={...data,id:id||uuid(),slug:norm(data.title).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),category:{slug:cat.slug,name:cat.name},salesCount:0,createdAt:new Date().toISOString(),localFiles:data.files};
      const ix=state.localProducts.findIndex(p=>p.id===saved.id);if(ix>=0)state.localProducts[ix]=saved;else state.localProducts.unshift(saved);
      localStorage.setItem('mec_local_products',JSON.stringify(state.localProducts));
    }
    toast(status==='published'?'Recurso guardado y publicado correctamente.':'Borrador guardado correctamente.');location.hash='#/admin/productos';
  }catch(err){toast(err.message,'error')}
}

function showResourcePreview(){
  try{
    const d=collectResource('draft'),cat=state.categories.find(c=>c.slug===d.categorySlug);d.id='preview';d.slug='preview';d.category={slug:cat.slug,name:cat.name};d.salesCount=0;
    $('#live-preview').innerHTML=productCard(d);
  }catch(e){toast(e.message,'error')}
}

async function adminPacks(){let packs;try{packs=(await api('/api/store-admin/packs')).packs}catch{packs=JSON.parse(localStorage.getItem('mec_packs')||'[]')}return adminWrap('Packs',`<div class="section-head"><div><h1>Packs</h1><p class="admin-sub">Agrupa materiales y define un valor especial.</p></div><button class="primary-btn" onclick="openPackModal()">＋ Crear pack</button></div><section class="admin-panel"><table class="data-table"><thead><tr><th>Nombre</th><th>Materiales</th><th>Precio</th><th>Estado</th></tr></thead><tbody>${packs.map(p=>`<tr><td>${esc(p.title)}</td><td>${p.products?.length||p.productIds?.length||0}</td><td>${clp(p.priceClp)}</td><td><span class="status ${p.status}">${p.status}</span></td></tr>`).join('')}</tbody></table></section>`)}
function openPackModal(){const products=allProducts().filter(p=>p.status==='published');modal(`<h2>Crear pack</h2><input id="pack-title" placeholder="Nombre del pack"><input id="pack-price" type="number" placeholder="Valor CLP"><div style="max-height:260px;overflow:auto">${products.map(p=>`<label class="check-option" style="display:block;margin:5px"><input type="checkbox" name="pack-product" value="${p.id}"> ${esc(p.title)}</label>`).join('')}</div><div class="modal-actions"><button class="outline-btn" onclick="closeModal()">Cancelar</button><button class="primary-btn" onclick="savePack()">Crear pack</button></div>`)}
async function savePack(){
  const title=$('#pack-title').value.trim(),priceClp=Number($('#pack-price').value),productIds=$$('input[name="pack-product"]:checked').map(x=>x.value);
  if(!title||!priceClp||!productIds.length)return toast('Completa nombre, valor y materiales.','error');
  try{await api('/api/store-admin/packs',{method:'POST',body:JSON.stringify({title,description:'Pack de materiales educativos',priceClp,coverUrl:'',status:'published',productIds})})}
  catch(err){
    if(state.apiOnline){toast(err.message,'error');return}
    const packs=JSON.parse(localStorage.getItem('mec_packs')||'[]');packs.unshift({id:uuid(),title,priceClp,productIds,status:'published'});localStorage.setItem('mec_packs',JSON.stringify(packs));
  }
  closeModal();toast('Pack creado.');render();
}

async function adminOrders(mode='Pedidos'){const orders=await getOrders();return adminWrap(mode,`<h1>${mode}</h1><p class="admin-sub">${mode==='Pagos'?'Registro de pagos aprobados, rechazados, anulados y reembolsados.':'Todos los pedidos realizados en la plataforma.'}</p><section class="admin-panel"><div style="overflow:auto"><table class="data-table"><thead><tr><th>Pedido</th><th>Comprador</th><th>Correo</th><th>Productos</th><th>Total</th><th>Pago</th><th>Entrega</th><th>Fecha</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${esc(o.orderNumber)}</td><td>${esc(o.fullName)}</td><td>${esc(o.email)}</td><td>${o.itemCount}</td><td>${clp(o.totalClp)}</td><td><span class="status ${o.paymentStatus}">${o.paymentStatus}</span></td><td><span class="status ${o.deliveryStatus}">${o.deliveryStatus}</span></td><td>${new Date(o.createdAt).toLocaleDateString('es-CL')}</td></tr>`).join('')}</tbody></table></div></section>`)}
async function adminCustomers(){let customers;try{customers=(await api('/api/store-admin/customers')).customers}catch{const orders=await getOrders(),m={};orders.forEach(o=>{m[o.email]??={fullName:o.fullName,email:o.email,orders:0,totalSpent:0,lastPurchaseAt:o.createdAt};m[o.email].orders++;m[o.email].totalSpent+=o.totalClp});customers=Object.values(m)}return adminWrap('Compradores',`<h1>Compradores</h1><p class="admin-sub">Todos los correos electrónicos que han comprado material educativo.</p><section class="admin-panel"><table class="data-table"><thead><tr><th>Nombre</th><th>Correo</th><th>Pedidos</th><th>Total comprado</th><th>Última compra</th></tr></thead><tbody>${customers.map(c=>`<tr><td>${esc(c.fullName)}</td><td>${esc(c.email)}</td><td>${c.orders}</td><td>${clp(c.totalSpent)}</td><td>${c.lastPurchaseAt?new Date(c.lastPurchaseAt).toLocaleDateString('es-CL'):'—'}</td></tr>`).join('')}</tbody></table></section>`)}
async function adminReports(){let r;try{r=await api('/api/store-admin/reports')}catch{const p=allProducts().sort((a,b)=>b.salesCount-a.salesCount);r={products:p.map(x=>({title:x.title,salesCount:x.salesCount,revenue:x.salesCount*x.priceClp})),categories:state.categories.map(c=>({name:c.name,revenue:p.filter(x=>x.category?.slug===c.slug).reduce((s,x)=>s+x.salesCount*x.priceClp,0),orders:p.filter(x=>x.category?.slug===c.slug).reduce((s,x)=>s+x.salesCount,0)})),months:Array.from({length:12},(_,i)=>({month:`2026-${String(i+1).padStart(2,'0')}`,sales:(i+1)*145000,orders:(i+1)*3}))}}const max=Math.max(1,...r.months.map(x=>x.sales));return adminWrap('Reportes',`<h1>Reportes de ventas</h1><p class="admin-sub">Ventas por mes, materiales más y menos vendidos, categorías e ingresos.</p><div class="admin-grid"><section class="admin-panel"><h3>Ventas mensuales</h3><div class="chart">${r.months.map(x=>`<div class="bar" style="height:${x.sales/max*100}%" data-tip="${x.month}: ${clp(x.sales)}"></div>`).join('')}</div></section><section class="admin-panel"><h3>Categorías con más ventas</h3>${r.categories.slice(0,8).map(c=>`<div class="summary-row"><span>${esc(c.name)}</span><b>${clp(c.revenue)}</b></div>`).join('')}</section></div><section class="admin-panel" style="margin-top:20px"><h3>Materiales más vendidos</h3><table class="data-table"><thead><tr><th>Material</th><th>Unidades</th><th>Ingresos</th></tr></thead><tbody>${r.products.map(p=>`<tr><td>${esc(p.title)}</td><td>${p.salesCount}</td><td>${clp(p.revenue)}</td></tr>`).join('')}</tbody></table></section>`)}
function adminConfig(){return adminWrap('Configuración',`<h1>Configuración</h1><p class="admin-sub">Estado de servicios externos y reglas de publicación.</p><div class="mission-grid"><section class="admin-panel"><h3>Pago inmediato</h3><p>El código incluye un modo de demostración seguro para probar el flujo completo. Para producción debes configurar el proveedor de pago contratado y sus credenciales.</p><span class="status draft">Requiere credenciales externas</span></section><section class="admin-panel"><h3>Correo de acceso</h3><p>Compatible con Resend mediante RESEND_API_KEY y EMAIL_FROM.</p><span class="status draft">Requiere dominio remitente</span></section><section class="admin-panel"><h3>Archivos privados</h3><p>Los documentos se guardan en PostgreSQL y solo se descargan tras validar el enlace de compra.</p><span class="status published">Protegido por token</span></section><section class="admin-panel"><h3>Sin sesiones individuales</h3><p>Los compradores acceden únicamente mediante enlace seguro asociado a su correo y pedido.</p><span class="status published">Activo</span></section></div>`)}
async function loadData(){try{const [c,p]=await Promise.all([api('/api/store/categories'),api('/api/store/products?limit=60')]);state.categories=c.categories.map((x,i)=>({...x,icon:DEMO_CATEGORIES.find(d=>d.slug===x.slug)?.icon||'📘'}));state.products=p.products;state.apiOnline=true}catch{state.categories=DEMO_CATEGORIES;state.products=DEMO_PRODUCTS;state.apiOnline=false}}
async function render(){const app=$('#app'),raw=location.hash||'#/',path=raw.split('?')[0],parts=path.replace(/^#\//,'').split('/').filter(Boolean);window.scrollTo(0,0);if(parts[0]==='biblioteca'){app.innerHTML='<div class="empty">Cargando biblioteca...</div>';app.innerHTML=await library(parts[1]);return}if(parts[0]==='admin'){if(!state.adminUser){app.innerHTML=adminLogin();return}app.innerHTML='<div class="empty">Cargando panel...</div>';const page=parts[1]||'';if(!page)app.innerHTML=await adminDashboard();else if(page==='productos')app.innerHTML=await adminProducts();else if(page==='subir-recurso')app.innerHTML=uploadPage();else if(page==='packs')app.innerHTML=await adminPacks();else if(page==='pedidos')app.innerHTML=await adminOrders('Pedidos');else if(page==='pagos')app.innerHTML=await adminOrders('Pagos');else if(page==='compradores')app.innerHTML=await adminCustomers();else if(page==='reportes')app.innerHTML=await adminReports();else if(page==='configuracion')app.innerHTML=adminConfig();else app.innerHTML=await adminDashboard();return}if(parts[0]==='superadministrador'){app.innerHTML=state.adminUser?await adminDashboard():adminLogin();return}if(path==='#/'||path==='#')app.innerHTML=home();else if(parts[0]==='plataformas')app.innerHTML=platforms();else if(parts[0]==='quienes-somos')app.innerHTML=about();else if(parts[0]==='mision-vision')app.innerHTML=mission();else if(parts[0]==='blog')app.innerHTML=blog();else if(parts[0]==='contacto')app.innerHTML=contact();else if(parts[0]==='catalogo')app.innerHTML=catalog();else if(parts[0]==='categorias')app.innerHTML=categoriesPage();else if(parts[0]==='categoria')app.innerHTML=categoryPage(parts[1]);else if(parts[0]==='material')app.innerHTML=detail(parts[1]);else if(parts[0]==='carrito')app.innerHTML=cartPage();else if(parts[0]==='checkout')app.innerHTML=checkout();else if(parts[0]==='compra-confirmada')app.innerHTML=confirmation();else if(parts[0]==='correo-enviado')app.innerHTML=emailSentPage();else app.innerHTML=notFound();updateCartCount()}
window.addEventListener('hashchange',render);window.addEventListener('DOMContentLoaded',async()=>{await loadData();render()});
</script>
